    material: STRIPPED_DARK_OAK_WOOD # Minecraft Material
    interaction: STORAGE
  frame: # Part name from model
    material: STRIPPED_OAK_WOOD  # Minecraft Material
  accent: # Part name from model
    material: GOLD_BLOCK # Minecraft Material








