name: "Large Wardrobe"
author: "AdvancedPlugins"
version: "1.0"
description: "A large Wardrobe."
properties:
  item:
    type: BROWN_SHULKER_BOX
  entity-collision-threshold: 0.2
  block-collision-threshold: 0
parts: # You can override default parts from models here
