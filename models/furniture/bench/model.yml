name: "Bench"
author: "AdvancedPlugins"
version: "1.0"
description: "An outdoors bench."
properties:
  item:
    type: DARK_OAK_STAIRS
  entity-collision-threshold: 0.6 
  block-collision-threshold: 0.3 
parameters:
  color:
    default: BROWN
    values: "%colors%"
    description: Bench color
parts: # You can override default parts from models here
  color: # Part name from model
    material: <color>_SHULKER_BOX # Minecraft Material
  frame: # Part name from model
    material: BLACK_SHULKER_BOX # Minecraft Material
  sit:
    interaction: SIT








