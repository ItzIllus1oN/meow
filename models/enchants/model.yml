name: "Custom Enchantments Display"
author: "AdvancedPlugins"
version: "1.0"
description: "Interact with Custom Enchantments' Enchanter."
properties:
  item:
    type: ENCHANTING_TABLE
  collision: true # Example of additional property  # Collision Threshold Settings
  # These settings control how the plugin handles collisions between models and existing blocks.

  # Threshold Explanation:
  # - Values range from 0.0 to 1.0, representing the volume overlap between a model and a block.
  # - 0.0 = any overlap, no matter how small
  # - 1.0 = complete overlap (entire block is filled)
  # - e.g., 0.5 = half the block's volume is overlapped by the model

  # Entity Collision Threshold:
  # Determines when to place invisible barrier blocks for entity entityCollision.
  # If the model occupies this percentage or more of a block's volume, a barrier is placed.
  entity-collision-threshold: 0.1 # Set to 0 to disable barrier placement

  # Block Collision Threshold:
  # Controls whether a model can be placed based on its overlap with existing blocks.
  # If the model would occupy more than this percentage of any existing block, placement is prevented.
  block-collision-threshold: 0.3 # Set to 0 to allow placement regardless of overlap

  # Examples:
  # - With entity-entityCollision-threshold at 0.5:
  #   Barrier blocks are placed where the model fills 50% or more of a block's volume.
  # - With block-entityCollision-threshold at 0.3:
  #   Model placement is allowed as long as it doesn't occupy more than 30% of any existing block.


parts: # You can override default parts from models here
  base: # Part name from model
    material: DEEPSLATE_BRICKS # Minecraft Material
    blockLight: 15
    skyLight: 15
    interaction: COMMAND
    value: enchanter
  base-big:
    material: CHISELED_TUFF_BRICKS
    blockLight: 15
    skyLight: 15
  blocks:
    material: BEE_NEST
    blockLight: 15
    skyLight: 15
  rocks:
    material: DEAD_BRAIN_CORAL_BLOCK
    blockLight: 15
    skyLight: 15
  carpet:
    material: PURPLE_GLAZED_TERRACOTTA
    blockLight: 15
    skyLight: 15
  sword:
    material: NETHERITE_SWORD
    blockLight: 15
    skyLight: 15
  purple_block:
    material: CRYING_OBSIDIAN
    blockLight: 15
    skyLight: 15
  anvil:
    material: ANVIL
    blockLight: 15
    skyLight: 15
